<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCode Assistant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Layout principal -->
  <div id="app" class="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="btn-new-session" class="btn-icon" title="Nova conversa">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <span class="sidebar-title">Conversas</span>
      </div>
      <div id="session-list" class="session-list">
        <!-- sessões inseridas via JS -->
      </div>
      <div class="sidebar-footer">
        <button id="btn-settings" class="btn-icon" title="Configurações">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </aside>

    <!-- Overlay sidebar mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Conteúdo principal -->
    <main class="main">
      <!-- Header -->
      <header id="main-header" class="main-header">
        <button id="btn-toggle-sidebar" class="btn-icon mobile-only" title="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="header-info">
          <h1 id="assistant-name" class="assistant-name">Assistente</h1>
          <span id="connection-status" class="connection-status offline" title="Desconectado">
            <span class="status-dot"></span>
            <span class="status-text">Offline</span>
          </span>
        </div>
        <div class="header-controls">
          <select id="model-selector" class="model-selector" title="Modelo de IA">
            <option value="">Carregando...</option>
          </select>
          <button id="btn-pet-toggle" class="btn-icon" title="Mostrar/ocultar pet">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
        </div>
      </header>

      <!-- Área de mensagens -->
      <div id="chat-area" class="chat-area">
        <!-- Tela vazia (quando não há sessões) -->
        <div id="empty-state" class="empty-state">
          <div class="empty-pet" id="empty-pet-container"></div>
          <h2 id="welcome-text">Olá! Sou seu assistente.</h2>
          <p class="empty-subtitle">Como posso ajudar você hoje?</p>
          <div class="empty-suggestions">
            <button class="suggestion-chip" data-prompt="Me ajude a escrever código">Escrever código</button>
            <button class="suggestion-chip" data-prompt="Explique um conceito para mim">Explicar conceito</button>
            <button class="suggestion-chip" data-prompt="Depure este erro para mim">Depurar erro</button>
            <button class="suggestion-chip" data-prompt="Reestruture este arquivo">Reestruturar código</button>
          </div>
        </div>

        <!-- Mensagens -->
        <div id="messages-container" class="messages-container hidden">
          <!-- mensagens inseridas via JS -->
        </div>

        <!-- Indicador de digitação -->
        <div id="typing-indicator" class="typing-indicator hidden">
          <div class="typing-avatar"></div>
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <!-- Input -->
      <div id="input-area" class="input-area">
        <!-- Arquivos anexados -->
        <div id="attached-files" class="attached-files hidden">
          <!-- chips de arquivos inseridos via JS -->
        </div>
        <div class="input-row">
          <button id="btn-attach" class="btn-icon" title="Anexar arquivo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="file-input" multiple class="hidden" accept="*/*">
          <textarea id="message-input" class="message-input" placeholder="Digite sua mensagem..." rows="1"></textarea>
          <button id="btn-send" class="btn-send" title="Enviar (Enter)" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
          <button id="btn-stop" class="btn-stop hidden" title="Parar geração">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
    </main>

    <!-- Pet overlay -->
    <div id="pet-overlay" class="pet-overlay">
      <canvas id="pet-canvas" width="192" height="208"></canvas>
    </div>

    <!-- Settings overlay -->
    <div id="settings-overlay" class="settings-overlay hidden">
      <div class="settings-panel">
        <div class="settings-header">
          <h2>Configurações</h2>
          <button id="btn-close-settings" class="btn-icon" title="Fechar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="settings-body">
          <!-- Abas -->
          <nav class="settings-tabs">
            <button class="tab-btn active" data-tab="assistant">Assistente</button>
            <button class="tab-btn" data-tab="user">Usuário</button>
            <button class="tab-btn" data-tab="folders">Pastas</button>
            <button class="tab-btn" data-tab="memories">Memórias</button>
            <button class="tab-btn" data-tab="pet">Pet</button>
            <button class="tab-btn" data-tab="agent">Agente</button>
          </nav>

          <!-- Conteúdo abas -->
          <div class="settings-content">
            <!-- Aba Assistente -->
            <div id="tab-assistant" class="tab-content active">
              <label class="field-label">Nome do assistente
                <input type="text" id="cfg-assistant-name" class="field-input" placeholder="Assistente">
              </label>
              <label class="field-label">Personalidade / Prompt do sistema
                <textarea id="cfg-assistant-personality" class="field-textarea" rows="4" placeholder="Você é um assistente amigável e prestativo..."></textarea>
              </label>
            </div>

            <!-- Aba Usuário -->
            <div id="tab-user" class="tab-content">
              <label class="field-label">Seu nome
                <input type="text" id="cfg-user-name" class="field-input" placeholder="Usuário">
              </label>
              <label class="field-label">Contexto sobre você
                <textarea id="cfg-user-context" class="field-textarea" rows="3" placeholder="Desenvolvedor, usa Linux, prefere Python..."></textarea>
              </label>
            </div>

            <!-- Aba Pastas -->
            <div id="tab-folders" class="tab-content">
              <p class="tab-desc">Pastas que o assistente pode acessar. As permissões são aplicadas pelo backend.</p>
              <div id="folders-list" class="items-list"></div>
              <div class="add-row">
                <input type="text" id="new-folder-path" class="field-input" placeholder="/caminho/para/pasta">
                <select id="new-folder-permission" class="field-select">
                  <option value="ask">Perguntar</option>
                  <option value="allow">Permitir</option>
                  <option value="deny">Negar</option>
                </select>
                <button id="btn-add-folder" class="btn-sm">Adicionar</button>
              </div>
            </div>

            <!-- Aba Memórias -->
            <div id="tab-memories" class="tab-content">
              <p class="tab-desc">Memórias persistentes que o assistente sempre lembrará.</p>
              <div id="memories-list" class="items-list"></div>
              <div class="add-row">
                <input type="text" id="new-memory-text" class="field-input" placeholder="Nova memória...">
                <button id="btn-add-memory" class="btn-sm">Adicionar</button>
              </div>
            </div>

            <!-- Aba Pet -->
            <div id="tab-pet" class="tab-content">
              <label class="field-label">Pet
                <select id="cfg-pet-id" class="field-select"></select>
              </label>
              <label class="field-label">Tamanho (px)
                <input type="number" id="cfg-pet-size" class="field-input" value="120" min="60" max="300" step="10">
              </label>
              <label class="field-label">Posição
                <select id="cfg-pet-position" class="field-select">
                  <option value="bottom-right">Canto inferior direito</option>
                  <option value="bottom-left">Canto inferior esquerdo</option>
                  <option value="top-right">Canto superior direito</option>
                  <option value="top-left">Canto superior esquerdo</option>
                  <option value="hidden">Oculto</option>
                </select>
              </label>
            </div>

            <!-- Aba Agente Secundário -->
            <div id="tab-agent" class="tab-content">
              <label class="field-label toggle-label">
                <input type="checkbox" id="cfg-agent-enabled">
                <span>Agente secundário habilitado</span>
              </label>
              <label class="field-label">Agente
                <select id="cfg-agent-name" class="field-select">
                  <option value="">Nenhum</option>
                </select>
              </label>
            </div>
          </div>
        </div>
        <div class="settings-footer">
          <button id="btn-save-settings" class="btn-primary">Salvar</button>
        </div>
      </div>
    </div>

    <!-- Permissão pendente -->
    <div id="permission-overlay" class="permission-overlay hidden">
      <div class="permission-card">
        <div class="permission-header">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <h3>Permissão solicitada</h3>
        </div>
        <p id="permission-description" class="permission-desc"></p>
        <label class="field-label">Mensagem (opcional)
          <input type="text" id="permission-message" class="field-input" placeholder="">
        </label>
        <div class="permission-actions">
          <button id="perm-allow-once" class="btn-secondary">Permitir uma vez</button>
          <button id="perm-allow-always" class="btn-primary">Sempre permitir</button>
          <button id="perm-reject" class="btn-danger">Rejeitar</button>
        </div>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Status bar -->
    <footer id="status-bar" class="status-bar">
      <span id="status-version">opencode: —</span>
      <span id="status-opencode" class="status-opencode offline">
        <span class="status-dot"></span>
        <span id="status-opencode-text">opencode offline</span>
      </span>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
